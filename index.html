<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Leer elke dag Nederlands in een uur, met echte situaties uit het dagelijks leven.">
<title>Elke dag Nederlands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Eén kolom: kop met taalkeuze, dan óf het dagoverzicht óf een oefenkaart. */
:root {
  --bg: #eef2f7; --surface: #ffffff; --ink: #14213d; --muted: #5b6478; --line: #d5dce6;
  --accent: #f2a900; --accent-soft: #fff3cf; --good: #1f8a5b; --good-soft: #e3f4ec; --bad: #c2410c; --bad-soft: #fde9df;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --arabic: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1626; --surface: #172036; --ink: #e8edf5; --muted: #9aa6bc; --line: #2a3550;
  --accent: #f5b82e; --accent-soft: #3a3016; --good: #3cc489; --good-soft: #143326; --bad: #f07b4a; --bad-soft: #3a1f14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1626; --surface: #172036; --ink: #e8edf5; --muted: #9aa6bc; --line: #2a3550;
  --accent: #f5b82e; --accent-soft: #3a3016; --good: #3cc489; --good-soft: #143326; --bad: #f07b4a; --bad-soft: #3a1f14; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.app[dir="rtl"] { font-family: var(--arabic); }
[lang="ar"] { font-family: var(--arabic); }
[lang="nl"] { font-family: var(--body); }
h1, h2 { margin: 0; text-wrap: balance; }

header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.merk { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; }
.taal { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.taal button { border-radius: 999px; padding: 4px 12px; font-size: .85rem; font-weight: 700; color: var(--muted); }
.taal button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* dagoverzicht */
.dag { display: flex; flex-direction: column; gap: 12px; }
.dagkop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.dagkop h2 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; }
.dagkop span { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.uurbalk { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.uurbalk b { display: block; height: 100%; background: var(--accent); }
.blokken { display: grid; gap: 10px; }
.blok-dag { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; text-align: start; width: 100%; }
.blok-dag .nr { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); font-variant-numeric: tabular-nums; }
.blok-dag.klaar .nr { background: var(--good); color: var(--surface); }
.blok-dag b { display: block; font-size: 1.05rem; }
.blok-dag small { display: block; color: var(--muted); font-size: .88rem; min-width: 0; }
.blok-dag .pijl { color: var(--muted); font-size: 1.3rem; }
[dir="rtl"] .blok-dag .pijl { transform: scaleX(-1); }
.blok-dag:disabled { opacity: .55; cursor: default; }
.cijfers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.cijfer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.cijfer b { display: block; font-family: var(--display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.cijfer span { font-size: .8rem; color: var(--muted); }
.thema { display: flex; flex-direction: column; gap: 6px; }
.thema h3 { margin: 8px 0 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
[dir="rtl"] .thema h3 { text-transform: none; letter-spacing: 0; font-size: .9rem; }
.sit { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: start; width: 100%; }
.sit .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }
.sit b { font-weight: 700; }
.sit small { display: block; color: var(--muted); font-size: .85rem; }
.sit .stipjes { display: flex; gap: 4px; }
.sit .stipjes i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.sit .stipjes i.aan { background: var(--good); }
.sit:disabled { opacity: .5; cursor: default; }
.sectie { font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin-top: 8px; }

/* oefenkaart */
.voortgang { display: flex; flex-direction: column; gap: 6px; }
.balkjes { display: flex; gap: 4px; }
.balkjes i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.balkjes i b { display: block; height: 100%; background: var(--accent); }
.voortgang-tekst { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; color: var(--muted); }
.stoppen { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.kaart { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 340px; }
.opdracht { font-size: .85rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin: 0; }
[dir="rtl"] .opdracht { text-transform: none; letter-spacing: 0; font-size: .95rem; }
.foto { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: var(--line); }
.scene { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--line); }
.icoon { width: 20px; height: 20px; flex: none; }
.woord { font-family: var(--display); font-weight: 800; font-size: 2.2rem; text-align: center; margin: 0; text-wrap: balance; }
.vertaling { text-align: center; color: var(--muted); font-size: 1.15rem; margin: 0; }
.tip { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .95rem; }
.toon { align-self: flex-start; font-size: .9rem; font-weight: 700; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 2px 0; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.knop { background: var(--ink); color: var(--surface); border-radius: 12px; padding: 14px 20px; font-weight: 700; font-size: 1.05rem; width: 100%; transition: transform .1s; }
.knop:active { transform: scale(.98); }
.knop:disabled { opacity: .4; cursor: default; }
.knop.zacht { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.luister { align-self: center; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: .95rem; }
.luister.groot { padding: 14px 24px; font-size: 1.05rem; border-width: 2px; border-color: var(--accent); }

.keuzes { display: grid; gap: 10px; }
.keuze { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 1.05rem; font-weight: 700; text-align: start; }
.keuze.goed { border-color: var(--good); background: var(--good-soft); }
.keuze.fout { border-color: var(--bad); background: var(--bad-soft); }
.knoppen { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.score { text-align: center; font-family: var(--display); font-weight: 800; font-size: 3.4rem; line-height: 1; margin: 8px 0 0; }
.score span { font-size: 1.5rem; color: var(--muted); }
.plaatjes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.plaatje { border: 3px solid transparent; border-radius: 14px; padding: 0; overflow: hidden; }
.plaatje img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.plaatje.goed { border-color: var(--good); }
.plaatje.fout { border-color: var(--bad); }
.vraag { display: flex; flex-direction: column; gap: 8px; }
.vraag small, .keuze small { display: block; font-weight: 400; font-size: .88rem; color: var(--muted); margin-top: 2px; }
.vt[hidden] { display: none; }
.document { background: var(--surface); border: 1px solid var(--line); border-inline-start: 5px solid var(--accent); border-radius: 10px; padding: 14px 16px; line-height: 1.5; }
.document h3 { margin: 0 0 6px; font-size: 1.05rem; }
.document p { margin: 0 0 6px; }
.document.bord { border: 3px solid var(--ink); text-align: center; font-weight: 700; font-size: 1.1rem; }
.document.bericht { border-inline-start-width: 1px; background: var(--accent-soft); border-radius: 16px 16px 16px 4px; }
.voorbeelden { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.voorbeelden li { display: flex; gap: 10px; align-items: flex-start; }
.voorbeelden small { display: block; color: var(--muted); }
.speel { flex: none; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 999px; display: grid; place-items: center; }
.gatzin { font-family: var(--display); font-weight: 700; font-size: 1.5rem; text-align: center; margin: 0; }
.gat { display: inline-block; min-width: 3em; border-bottom: 3px solid var(--accent); color: transparent; }
.vraag p { margin: 0; font-weight: 700; }

input[type=text], textarea { font-family: var(--body); font-size: 1.2rem; padding: 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
textarea { min-height: 110px; resize: vertical; line-height: 1.4; }

.zin { min-height: 56px; border-bottom: 2px dashed var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; align-content: flex-start; }
.blokjes { display: flex; flex-wrap: wrap; gap: 8px; }
.blok { border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 1.1rem; background: var(--surface); font-family: var(--body); }
.blokjes .blok[disabled] { visibility: hidden; }
.zin .blok[disabled] { cursor: default; }
.bank { display: flex; flex-wrap: wrap; gap: 6px; }
.bank span { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: .9rem; }
.bank span small { color: var(--muted); }

.ballon { display: flex; gap: 10px; align-items: flex-end; }
.ballon .wie { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; object-position: 50% 35%; flex: none; background: var(--line); }
.ballon .tekst { background: var(--accent-soft); border-radius: 14px 14px 14px 4px; padding: 12px 14px; font-size: 1.15rem; font-weight: 700; }
.ballon .tekst .hulp { display: block; font-weight: 400; font-size: .95rem; color: var(--muted); margin-top: 4px; }
.uitschrift { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .98rem; }
.uitschrift b { color: var(--muted); }
.mic { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--accent); border-radius: 12px; padding: 12px; font-weight: 700; width: 100%; }
.mic.bezig { background: var(--accent-soft); }
.gehoord { font-size: .9rem; color: var(--muted); margin: 0; }

.uitslag { border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.uitslag.goed { background: var(--good-soft); color: var(--good); }
.uitslag.fout { background: var(--bad-soft); color: var(--bad); }
.uitslag > span { display: block; font-weight: 400; color: var(--ink); margin-top: 2px; }
.eisen { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.eisen li::before { content: "✗ "; color: var(--bad); font-weight: 700; }
.eisen li.ok::before { content: "✓ "; color: var(--good); }
.duw { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

.sterren { font-size: 2.6rem; text-align: center; letter-spacing: .1em; color: var(--accent); }
.kan { font-family: var(--display); font-weight: 600; font-size: 1.35rem; text-align: center; margin: 0; text-wrap: balance; }
[dir="rtl"] .kan { font-family: var(--arabic); }
.lijst { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.lijst li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.lijst li span:last-child { color: var(--muted); }
footer { font-size: .8rem; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

const OPSLAG = 'elke-dag-nederlands-v1';

const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const zonderLidwoord = s => s.replace(/^(de|het)\s+/i, '');
const norm = s => s.toLowerCase().replace(/[.,!?¿;:"']/g, '').replace(/\s+/g, ' ').trim();
// Woorden met dezelfde betekenis tellen als goed: wie "bedankt" zegt in plaats van "dank je" heeft het niet fout.
// Per woord kan een situatie er nog meer geven met "ook": [...].
const SYNONIEMEN = [
  ['dank je', 'dank je wel', 'dankjewel', 'dank u', 'dank u wel', 'dankuwel', 'bedankt', 'heel erg bedankt', 'merci'],
  ['hoi', 'hallo', 'hai', 'hey', 'hee', 'hi'],
  ['tot ziens', 'doei', 'doeg', 'dag dag', 'tot de volgende keer'],
  ['goedemorgen', 'goeiemorgen'], ['goedemiddag', 'goeiemiddag'], ['goedenavond', 'goeienavond'],
  ['alsjeblieft', 'alstublieft', 'asjeblieft', 'alsjeblief'],
  ['sorry', 'pardon', 'excuseer', 'excuses', 'excuseer mij'],
  ['ja', 'jawel', 'jazeker', 'ja zeker', 'ja hoor'], ['nee', 'neen', 'nee hoor'],
  ['oké', 'oke', 'okee', 'ok', 'okay', 'prima', 'is goed', 'dat is goed'],
  ['graag', 'heel graag'],

const eenVorm = s => { // vervang elke variant door één vaste vorm, langste eerst

};

}

// Opnames komen per situatie uit audio/<situatie>.js (bouw.py); sleutel = spreker|tempo|tekst.

const AUDIO = {}, geladen = {};

// ---------- sessies ----------
function maakLes(sit, n) {

    vorige.sort((a, b) => ((d.items || {})[itemSleutel(sit, a)]?.op || 0) - ((d.items || {})[itemSleutel(sit, b)]?.op || 0));
    shuffle(vorige.slice(0, L.opwarmen)).forEach(w => taken.push({ soort: 'typ', stap: 'opwarmen', w, opwarm: true }));
  }
  const W = L.woorden || [], ander = w => shuffle(W.filter(x => x !== w)).slice(0, 2);
  W.forEach(w => taken.push({ soort: 'intro', stap: 'woorden', w }));
  if (W.length >= 3) shuffle(W).forEach(w => taken.push({ soort: L.woordOefening === 'kies' ? 'kies' : 'hoor', stap: 'woorden', w, opties: shuffle([w, ...ander(w)]) }));
  shuffle(W).forEach(w => taken.push({ soort: 'typ', stap: 'woorden', w }));
  shuffle(L.zinnen || []).forEach(z => taken.push({ soort: 'bouw', stap: 'zinnen', z, luisteren: !L.hulpOpen }));
  if (L.patroon) {
    taken.push({ soort: 'patroonUitleg', stap: 'patroon', p: L.patroon });
    shuffle(L.patroon.oefeningen).forEach(o => taken.push({ soort: 'gat', stap: 'patroon', o }));
  }
  shuffle(L.dictee || []).forEach(z => taken.push({ soort: 'dictee', stap: 'dictee', z }));
  if (L.luisteren) taken.push({ soort: 'luisteren', stap: 'luisteren', l: L.luisteren });
  if (L.lezen) taken.push({ soort: 'lezen', stap: 'lezen', l: L.lezen });
  if (L.knm) taken.push({ soort: 'knm', stap: 'knm', k: L.knm });
  if (L.schrijven) taken.push({ soort: 'schrijven', stap: 'schrijven', s: L.schrijven });
  (L.gesprek || []).forEach(g => taken.push({ soort: g.goed ? 'vrij' : 'gesprek', stap: 'gesprek', g }));
  // Elke paar oefeningen een mini-toets en aan het eind een eindtoets: zelf ophalen houdt het vast.
  const metToets = []; let tel = 0;
  taken.forEach((t, k) => { metToets.push(t); if (t.soort !== 'intro' && ++tel % ELKE === 0 && k < taken.length - 1) metToets.push({ soort: 'toets', stap: t.stap }); });
  if (W.length >= 3) metToets.push({ soort: 'toets', stap: 'eindtoets', eind: true });
  return metToets;
}
const ELKE = 6, EIND = 8; // mini-toets na elke 6 oefeningen; eindtoets van max. 8 woorden

// Een toets wordt pas samengesteld als hij aan de beurt is: wat een paar oefeningen geleden was, lastige eerst.
function toets(t) {
  const L = S.les.sit.niveaus[S.les.n], nr = Object.keys(S.toetsen).length + 1;
  let items;
  if (t.eind) items = shuffle(L.woorden || []).slice(0, EIND);
  else {
    const gezien = new Map();
    S.taken.slice(0, Math.max(0, S.i - 3)).forEach(x => { const y = x.w || x.z; if (y && !x.opwarm) gezien.set(y.id, y); });
    const lastig = id => S.fouten[`${S.les.sit.id}:${id}`] ? 0 : 1;
    items = shuffle([...gezien.values()]).sort((a, b) => lastig(a.id) - lastig(b.id)).slice(0, 3);
  }
  if (!items.length) { S.taken.splice(S.i, 1); return teken(); }
  S.toetsen[nr] = { fout: 0 };
  const vragen = items.map((x, k) => (L.woorden || []).includes(x) || x.foto
    ? { soort: k % 2 ? 'hoorTyp' : 'typ', stap: t.stap, w: x, toets: nr }
    : { soort: 'dictee', stap: t.stap, z: x, toets: nr });
  S.taken.splice(S.i, 1, ...vragen, { soort: 'toetsUitslag', stap: t.stap, toets: nr, tot: vragen.length, eind: t.eind });
  teken();
}
function toetsUitslag(t) {
  const goed = t.tot - S.toetsen[t.toets].fout;
  el(`<p class="opdracht">${t.eind ? t_().stappen.eindtoets : t_().toets}</p>
    <div class="score"><b>${goed}</b><span> / ${t.tot}</span></div>
    <p class="kan">${goed === t.tot ? t_().toetsTop : goed * 2 >= t.tot ? t_().toetsGoed : t_().toetsOefen}</p>${duwKnop()}`);
  bindVerder();
}
async function startLes(sit, n) {
  await laadAudio([sit.id]);
  const L = sit.niveaus[n];
  Object.assign(S, { modus: 'start', les: { sit, n }, blok: 'nieuw', taken: maakLes(sit, n), i: 0, fouten: {}, toetsen: {}, start: 0 });
  sessieKader();
  const stappen = [...new Set(S.taken.map(t => t.stap))];
  el(`<img class="scene" src="${beeld(sit.scene)}" alt="">
    <p class="opdracht" lang="nl" dir="ltr">${sit.titel}</p>
    <p class="opdracht">${L.naam[TAAL]}</p>
    <div class="ballon"><img class="wie" src="${beeld(pers(sit).foto)}" alt="${pers(sit).naam}"><div class="tekst">${nl(L.gesprek[0].zij)}${hulp(L.gesprek[0])}</div></div>
    <p>${L.scene[TAAL]}</p>
    <ul class="lijst">${stappen.map(s => `<li><span>${t_().lijst[s]}</span><span>${s === 'gesprek' ? t_().beurten(L.gesprek.length) : s === 'woorden' ? L.woorden.length : s === 'eindtoets' ? Math.min(EIND, L.woorden.length) : s === 'opwarmen' ? L.opwarmen : S.taken.filter(t => t.stap === s).length}</span></li>`).join('')}</ul>
    <div class="duw"><button class="knop" id="begin">${t_().begin(L.minuten)}</button></div>`);
  document.getElementById('begin').onclick = () => { S.modus = 'sessie'; S.start = Date.now(); teken(); };
}
// ---------- proefexamen ----------
// Opgebouwd als het A2-examen: lezen, luisteren, KNM, schrijven en spreken, met een score per onderdeel.
// Stof komt uit situaties waarvan alle drie de niveaus af zijn. Geen herkansing binnen het examen.
const MIN_EXAMEN = 3, GRENS = 0.7; // geslaagd per onderdeel vanaf ongeveer 70% goed, zoals bij het echte examen
const examenStof = () => { const k = lees().klaar || {}; return SITUATIES.filter(s => s.niveaus.every((_, n) => k[`${s.id}:${n}`])); };
async function startProefexamen() {
  const sits = examenStof(); if (sits.length < MIN_EXAMEN) return;
  await laadAudio(sits.map(s => s.id));
  const pak = (veld, n) => shuffle(sits.filter(s => s.niveaus[2][veld])).slice(0, n), taken = [];
  const ex = (deel, tot) => ({ deel, tot, score: 0 });
  pak('lezen', 2).forEach(sit => { const l = sit.niveaus[2].lezen; taken.push({ soort: 'lezen', stap: 'lezen', l, sit, examen: ex('lezen', l.vragen.length) }); });
  pak('luisteren', 2).forEach(sit => { const l = sit.niveaus[2].luisteren; taken.push({ soort: 'luisteren', stap: 'luisteren', l, sit, examen: ex('luisteren', l.vragen.length) }); });
  pak('knm', 2).forEach(sit => { const k = sit.niveaus[2].knm; taken.push({ soort: 'knm', stap: 'knm', k, sit, examen: ex('knm', k.vragen.length) }); });
  pak('schrijven', 1).forEach(sit => { const s = sit.niveaus[2].schrijven; taken.push({ soort: 'schrijven', stap: 'schrijven', s, sit, examen: ex('schrijven', s.eisen.length) }); });
  pak('gesprek', 1).forEach(sit => sit.niveaus[2].gesprek.filter(g => g.goed).slice(0, 4)
    .forEach(g => taken.push({ soort: 'vrij', stap: 'gesprek', g, sit, n: 2, examen: ex('gesprek', 1) })));
  Object.assign(S, { modus: 'sessie', les: null, blok: 'examen', taken, i: 0, fouten: {}, toetsen: {}, start: Date.now() });
  sessieKader(); teken();
}
function examenUitslag() {
  const delen = {};
  S.taken.forEach(t => { if (!t.examen) return; const x = delen[t.examen.deel] = delen[t.examen.deel] || [0, 0]; x[0] += t.examen.score; x[1] += t.examen.tot; });
  return delen;
}
function toonExamen(delen) {
  const geslaagd = Object.values(delen).filter(([s, n]) => s / n >= GRENS).length, tot = Object.keys(delen).length;
  el(`<p class="opdracht">${t_().proef}</p>
    <div class="score"><b>${geslaagd}</b><span> / ${tot}</span></div>
    <p class="kan">${t_().proefGehaald}</p>
    <ul class="lijst">${Object.entries(delen).map(([k, [s, n]]) => `<li><span>${t_().stappen[k]}</span><span>${s} / ${n} ${s / n >= GRENS ? '✓' : '✗'}</span></li>`).join('')}</ul>
    <div class="tip">${t_().proefUitleg}</div>
    <div class="duw"><button class="knop" id="terug">${t_().terug}</button></div>`);
  document.getElementById('terug').onclick = toonVandaag;
}

const blok3 = () => ['luisteren', 'lezen', 'schrijven'][Math.floor(Date.now() / 864e5) % 3]; // blok 3 wisselt per dag
async function startBlok(blok) {
  const d = lees();
  await laadAudio(Object.keys(d.items || {}).map(k => k.split(':')[0]).concat(Object.keys(d.klaar || {}).map(k => k.split(':')[0])));
  if (blok === 'nieuw') { const les = huidigeLes(); if (les) startLes(les.sit, les.n); return; }
  let taken = [];
  if (blok === 'herhalen') {
    let lijst = teHerhalen();
    if (!lijst.length) lijst = shuffle(Object.keys(d.items || {}).filter(itemZoek)).slice(0, 10);
    lijst.slice(0, 15).forEach((k, i) => {
      const it = itemZoek(k);
      if (it.soort === 'woord') taken.push({ soort: i % 2 ? 'hoorTyp' : 'typ', stap: 'herhalen', w: it.x, sit: it.sit });
      else taken.push({ soort: 'dictee', stap: 'herhalen', z: it.x, sit: it.sit });
    });
  }
  if (blok === 'luisteren') {
    const met3 = Object.keys(d.klaar || {}).map(k => k.split(':')).filter(([, n]) => +n >= 2).map(([s]) => sitVan(s)).filter(s => s && s.niveaus[2]);
    if (met3.length) {
      const sit = met3[met3.length - 1], L = sit.niveaus[2];
      const keuze = blok3();
      if (keuze === 'luisteren' && L.luisteren) taken.push({ soort: 'luisteren', stap: 'luisteren', l: L.luisteren, sit });
      else if (keuze === 'lezen' && L.lezen) taken.push({ soort: 'lezen', stap: 'lezen', l: L.lezen, sit });
      else if (L.schrijven) taken.push({ soort: 'schrijven', stap: 'schrijven', s: L.schrijven, sit });
    }
    // luisteren naar bekende woorden en zinnen: horen, herkennen, nabouwen
    const bekend = Object.keys(d.items || {}).map(itemZoek).filter(Boolean);
    const woorden = bekend.filter(x => x.soort === 'woord'), zinnen = bekend.filter(x => x.soort === 'zin');
    shuffle(woorden).slice(0, 6).forEach(it => {
      const pool = woorden.filter(o => o.x.foto && o.x !== it.x).map(o => o.x);
      if (pool.length >= 2) taken.push({ soort: 'hoor', stap: 'luisteren', w: it.x, sit: it.sit, opties: shuffle([it.x, ...shuffle(pool).slice(0, 2)]) });
    });
    shuffle(zinnen).slice(0, 4).forEach(it => taken.push({ soort: 'bouw', stap: 'luisteren', z: it.x, sit: it.sit, luisteren: true }));
  }
  if (blok === 'spreken') {
    const a = laatstAfgerond(); if (!a) return;
    a.sit.niveaus[a.n].gesprek.forEach(g => taken.push({ soort: g.goed ? 'vrij' : 'gesprek', stap: 'gesprek', g, sit: a.sit, n: a.n }));
  }
  if (!taken.length) return;
  Object.assign(S, { modus: 'sessie', les: null, blok, taken, i: 0, fouten: {}, toetsen: {}, start: Date.now() });
  sessieKader(); teken();
}

function sessieKader() {
  stopGeluid();
  scherm.innerHTML = `<div class="voortgang"><div class="balkjes" id="balkjes"></div><div class="voortgang-tekst"><span id="staptekst"></span><button class="stoppen" id="stoppen">${t_().stoppen}</button></div></div>
    <main class="kaart" id="kaart" aria-live="polite"></main>`;
  kaart = document.getElementById('kaart');
  document.getElementById('stoppen').onclick = () => { boekMinuten(); toonVandaag(); };
}
function tekenVoortgang() {
  const stappen = [...new Set(S.taken.map(t => t.stap))];
  const huidig = S.i < S.taken.length ? S.taken[S.i].stap : null;
  document.getElementById('balkjes').innerHTML = stappen.map(s => {
    const tot = S.taken.filter(t => t.stap === s).length, gedaan = S.taken.slice(0, S.i).filter(t => t.stap === s).length;
    return `<i><b style="width:${Math.round(100 * gedaan / tot)}%"></b></i>`;
  }).join('');
  const st = document.getElementById('staptekst'), stoppen = document.getElementById('stoppen');
  if (stoppen) stoppen.textContent = t_().stoppen;
  if (st) st.textContent = huidig ? t_().stap(stappen.indexOf(huidig) + 1, stappen.length, t_().stappen[huidig]) : '';
}
function boekMinuten() {
  if (!S.start) return;
  const [d, dag] = dagLog(); dag.min += (Date.now() - S.start) / 60000; S.start = 0; bewaar(d);
}

function el(html) {
  kaart.innerHTML = html;
  kaart.querySelectorAll('[data-toon]').forEach(b => b.onclick = () => { document.getElementById(b.dataset.toon).hidden = false; b.remove(); });
  const f = kaart.querySelector('input, textarea'); if (f) f.focus();
}
const sitVanTaak = t => t.sit || (S.les && S.les.sit);
const hulpOpen = () => S.les ? !!S.les.sit.niveaus[S.les.n].hulpOpen : false;
function hulpBlok(x, dicht) { // dicht: in een toets eerst zelf ophalen, vertaling alleen op verzoek
  if (hulpOpen() && !dicht) return `<p class="vertaling">${hulp(x)}</p>`;
  const id = 'h' + Math.random().toString(36).slice(2, 8);
  return `<button class="toon" data-toon="${id}">${t_().toon}</button><span id="${id}" hidden>${hulp(x)}</span>`;
}
function fout(t, id) {
  S.fouten[`${sitVanTaak(t).id}:${id}`] = (S.fouten[`${sitVanTaak(t).id}:${id}`] || 0) + 1;
  if (t.toets) S.toetsen[t.toets].fout++;
}
function terugInRij(taak) { // fouten zijn data: de taak komt later in de sessie terug
  if (S.blok === 'examen') return; // een examen telt de eerste poging
  const kopie = Object.assign({}, taak, { herhaling: true, toets: 0 });
  const eindeStap = S.taken.findIndex((t, k) => k > S.i && t.stap !== taak.stap);
  S.taken.splice(eindeStap === -1 ? S.taken.length : eindeStap, 0, kopie);
}
function volgende() { S.i++; teken(); }
const uitslag = (goed, kop, regel) => `<div class="uitslag ${goed ? 'goed' : 'fout'}" role="status">${kop}${regel ? `<span>${regel}</span>` : ''}</div>`;
const duwKnop = () => `<div class="duw"><button class="knop" id="verder">${t_().verder}</button></div>`;
function bindVerder() { const b = document.getElementById('verder'); if (b) { b.onclick = volgende; b.focus(); } }
const nogEens = t => t.toets ? `${t_().toets} · ` : t.herhaling ? t_().nogEens : '';
const datum = ms => new Date(ms).toLocaleDateString(t_().datum, { weekday: 'long', day: 'numeric', month: 'long' });

function teken() {
  tekenVoortgang();
  if (S.i >= S.taken.length) return klaar();
  const t = S.taken[S.i];
  ({ intro, kies, hoor, typ, hoorTyp: typ, bouw, dictee, luisteren, schrijven, gesprek, vrij, toets, toetsUitslag, patroonUitleg, gat, lezen, knm })[t.soort](t);
}

// Ezelsbruggetje bij een woord, zodat het blijft hangen.
const onthoud = w => w.uitleg ? `<p class="tip"><b>${t_().onthoud}</b> ${w.uitleg[TAAL]}</p>` : '';

function intro(t) {
  const w = t.w, W = S.les ? S.les.sit.niveaus[S.les.n].woorden || [] : [];
  if (t.gok === undefined && w.foto && W.filter(x => x.foto).length >= 3) return raad(t, W);
  el(`${t.gok === undefined ? '' : t.gok ? uitslag(true, t_().raadGoed) : `<p class="tip">${t_().raadNu}</p>`}
    <p class="opdracht">${t_().nieuw}</p>${foto(w)}
    <p class="woord" lang="nl" dir="ltr">${w.nl}</p><p class="vertaling">${hulp(w)}</p>${onthoud(w)}
    <div class="knoppen"><button class="luister" id="luister">${ICOON.luister} ${t_().luister}</button>${zegNaKnop()}</div>
    <p class="vertaling" id="gehoord"></p>${duwKnop()}`);
  document.getElementById('luister').onclick = () => spreek(w.nl);
  zegNa(w); spreek(w.nl); bindVerder();
}

// Eerst raden, dan pas het antwoord: ook een foute gok laat het goede antwoord beter hangen.
function raad(t, W) {
  const opties = shuffle([t.w, ...shuffle(W.filter(x => x !== t.w && x.foto)).slice(0, 2)]);
  el(`<p class="opdracht">${t_().raad}</p>
    <p class="woord" lang="nl" dir="ltr">${t.w.nl}</p>
    <button class="luister" id="luister">${ICOON.luister} ${t_().luister}</button>
    <div class="plaatjes">${opties.map((o, k) => `<button class="plaatje" data-k="${k}"><img src="${beeld(o.foto)}" alt=""></button>`).join('')}</div>
    <p class="tip">${t_().raadUitleg}</p>`);
  document.getElementById('luister').onclick = () => spreek(t.w.nl);
  spreek(t.w.nl);
  kaart.querySelectorAll('.plaatje').forEach(b => b.onclick = () => {
    t.gok = opties[+b.dataset.k] === t.w;
    kaart.querySelectorAll('.plaatje').forEach(x => { x.disabled = true; if (opties[+x.dataset.k] === t.w) x.classList.add('goed'); });
    if (!t.gok) b.classList.add('fout');
    setTimeout(() => intro(t), 900);
  });
}

// Nazeggen: met spraakherkenning een check, anders opnemen en terugspelen naast de Nederlandse stem.
const kanOpnemen = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let opnameWerkt = true;
const zegNaKnop = () => (Herkenning && micWerkt) || (kanOpnemen() && opnameWerkt) ? `<button class="luister" id="zegna">${ICOON.mic} ${t_().zegNa}</button>` : '';
function zegNa(w) {
  const b = document.getElementById('zegna'), uit = document.getElementById('gehoord'); if (!b) return;
  b.onclick = () => {
    if (!Herkenning) return opnemen(w, b, uit);
    let r; try { r = new Herkenning(); } catch { return opnemen(w, b, uit); }
    r.lang = 'nl-NL'; r.maxAlternatives = 3; r.interimResults = false;
    b.classList.add('bezig'); uit.textContent = t_().luistert;
    r.onresult = e => {
      const opties = Array.from(e.results[0]).map(x => x.transcript), doel = norm(zonderLidwoord(norm(w.nl)));
      uit.innerHTML = opties.some(o => norm(o).includes(doel)) ? `<b>${t_().goedGezegd}</b>` : `${t_().hoorde} "${nl(opties[0])}". ${t_().nogmaals}`;
    };
    r.onerror = e => { b.classList.remove('bezig'); if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) { micWerkt = false; opnemen(w, b, uit); } else uit.textContent = t_().niets; };
    r.onend = () => b.classList.remove('bezig');
    try { r.start(); } catch { opnemen(w, b, uit); }
  };
}
async function opnemen(w, b, uit) {
  if (!kanOpnemen()) { b.remove(); return; }
  let stroom; try { stroom = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { opnameWerkt = false; b.remove(); uit.textContent = ''; return; }
  const rec = new MediaRecorder(stroom), stukken = [];
  rec.ondataavailable = e => stukken.push(e.data);
  rec.onstop = () => {
    stroom.getTracks().forEach(x => x.stop()); b.classList.remove('bezig');
    const a = new Audio(URL.createObjectURL(new Blob(stukken, { type: rec.mimeType })));
    uit.textContent = t_().jijEnStem; a.onended = () => spreek(w.nl); a.play();
  };
  b.classList.add('bezig'); uit.textContent = t_().luistert; rec.start(); setTimeout(() => rec.stop(), 2500);
}

function kies(t) {
  el(`<p class="opdracht">${nogEens(t)}${t_().kies}</p>${foto(t.w)}
    <div class="keuzes" dir="ltr">${t.opties.map((o, k) => `<button class="keuze" lang="nl" data-k="${k}">${o.nl}</button>`).join('')}</div><div id="reactie"></div>`);

    bindVerder();

}

// Luisteren: je hoort het woord en kiest de juiste tekening (geen tekst als hulp).
function hoor(t) {
  el(`<p class="opdracht">${nogEens(t)}${t_().hoor}</p>
    <button class="luister groot" id="luister">${ICOON.luister} ${t_().speelAf}</button>
    <div class="plaatjes">${t.opties.map((o, k) => `<button class="plaatje" data-k="${k}"><img src="${beeld(o.foto)}" alt=""></button>`).join('')}</div><div id="reactie"></div>`);
  document.getElementById('luister').onclick = () => spreek(t.w.nl);
  spreek(t.w.nl);
  kaart.querySelectorAll('.plaatje').forEach(b => b.onclick = () => {
    const goed = t.opties[+b.dataset.k] === t.w;
    kaart.querySelectorAll('.plaatje').forEach(x => { x.disabled = true; if (t.opties[+x.dataset.k] === t.w) x.classList.add('goed'); });

    <div id="reactie"><div class="duw"><button class="knop" id="check" form="f">${t_().check}</button></div></div>`);

    const kern = norm(zonderLidwoord(a)) === norm(zonderLidwoord(doel));
    const synoniem = !kern && [t.w.nl, ...(t.w.ook || [])].some(o => zelfde(a, o));

    document.getElementById('reactie').innerHTML = html + duwKnop();
    bindVerder();
  };
}

// Blokjes: tik een blokje om het in de zin te zetten, tik in de zin om het terug te leggen.
function blokjesVeld(woorden, opKlaar) {
  const gekozen = [], pool = shuffle(woorden.map((w, k) => ({ w, k })));
  function render() {
    document.getElementById('zin').innerHTML = gekozen.map((b, n) => `<button class="blok" lang="nl" data-n="${n}">${b.w}</button>`).join('');
    document.getElementById('blokjes').innerHTML = pool.map(b => `<button class="blok" lang="nl" data-k="${b.k}" ${gekozen.includes(b) ? 'disabled' : ''}>${b.w}</button>`).join('');
    document.querySelectorAll('#zin .blok').forEach(x => x.onclick = () => { gekozen.splice(+x.dataset.n, 1); render(); });
    document.querySelectorAll('#blokjes .blok').forEach(x => x.onclick = () => { gekozen.push(pool.find(b => b.k === +x.dataset.k)); render(); });
    opKlaar(gekozen.length > 0);
  }
  render();
  return () => gekozen.map(b => b.w).join(' ');
}

function micKnop(beoordeel, doelen) {
  const mic = document.getElementById('mic'); if (!mic) return;
  mic.onclick = () => {
    let r;

    r.lang = 'nl-NL'; r.maxAlternatives = 3; r.interimResults = false;
    mic.classList.add('bezig'); mic.innerHTML = `${ICOON.mic} ${t_().luistert}`;
    const gehoord = document.getElementById('gehoord');
    r.onresult = e => {
      const opties = Array.from(e.results[0]).map(x => x.transcript);
      gehoord.innerHTML = `${t_().hoorde} "${nl(opties[0])}"`;
      const beste = opties.find(o => doelen.some(d => norm(d).split(' ').every(w => norm(o).split(' ').includes(w)))) || opties[0];
      beoordeel(beste, true);
    };
    r.onerror = e => {
      mic.classList.remove('bezig');
      if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) { micWerkt = false; mic.remove(); gehoord.textContent = t_().geenMic; }
      else { mic.innerHTML = `${ICOON.mic} ${t_().zeg}`; gehoord.textContent = t_().niets; }
    };
    r.onend = () => mic.classList.remove('bezig');
    try { r.start(); } catch { micWerkt = false; mic.remove(); }
  };
}
// Een * in een antwoordmodel staat voor een eigen woord (je naam, land, stad, getal).
const overlap = (antwoord, doel) => {
  const a = eenVorm(antwoord).split(' '), d = eenVorm(doel).split(' ');
  const eigen = d.filter(w => w === '*').length, vast = d.filter(w => w !== '*');
  if (eigen && a.length < vast.length + eigen) return 0;
  return (vast.filter(w => a.includes(w)).length + eigen) / d.length - Math.max(0, a.length - d.length - 2) * 0.1;
};
const toonModel = d => d.replace(/\*\.?/g, '…');

function gesprekKop(t) {
  const sit = sitVanTaak(t), p = pers(sit, t.g.spreker), lijst = S.taken.filter(x => x.stap === 'gesprek' && !x.herhaling), nr = lijst.indexOf(lijst.find(x => x.g === t.g)) + 1;
  return { sit, p, html: `<p class="opdracht">${nogEens(t)}${t_().gesprek(nr, lijst.length)}</p>
    <div class="ballon"><img class="wie" src="${beeld(p.foto)}" alt="${p.naam}"><div class="tekst">${nl(t.g.zij)}${hulpOpen() ? hulp(t.g) : ''}</div></div>
    ${hulpOpen() ? '' : hulpBlok(t.g)}
    <button class="luister" id="luister">${ICOON.luister} ${t_().luisterSara(p.naam)}</button>
    <p class="opdracht">${t_().watZeg}</p>
    ${micWerkt ? `<button class="mic" id="mic">${ICOON.mic} ${t_().zeg}</button><p class="gehoord" id="gehoord"></p>` : ''}` };
}
function gesprek(t) {
  const g = t.g, k = gesprekKop(t);

  const beoordeel = (antwoord, gesproken) => {

    bindVerder();

  document.getElementById('check').onclick = () => beoordeel(zin(), false);
  micKnop(beoordeel, [g.jij]);
}
// Vrij antwoorden (niveau 3): typen of zeggen, meerdere goede antwoorden.
function vrij(t) {
  const g = t.g, k = gesprekKop(t);
  el(`${k.html}<form id="f"><input type="text" id="antwoord" lang="nl" dir="ltr" autocomplete="off" spellcheck="false" aria-label="${t_().typAntwoord}" placeholder="${t_().typAntwoord}"></form>

  document.getElementById('luister').onclick = () => spreek(g.zij, spreker); spreek(g.zij, spreker);
  const beoordeel = (antwoord) => {
    const scores = g.goed.map(d => ({ d, s: overlap(antwoord, d) })).sort((a, b) => b.s - a.s);
    const goed = scores[0].s >= 0.75;
    if (t.examen) t.examen.score = goed ? 1 : 0;
    const inv = document.getElementById('antwoord'); if (inv) inv.disabled = true;
    kaart.querySelectorAll('.mic').forEach(x => x.disabled = true);
    if (!goed) { fout(t, g.id); terugInRij(t); }
    const anders = g.goed.filter(d => d !== scores[0].d).slice(0, 3).map(d => nl(toonModel(d))).join(' · ');
    document.getElementById('reactie').innerHTML = uitslag(goed, goed ? t_().goedGezegd : t_().nietGoed, goed ? `${t_().ookGoed} ${anders}` : `${t_().jeZegt} <b>${nl(toonModel(scores[0].d))}</b>`) + duwKnop();
    bindVerder();
  };
  document.getElementById('f').onsubmit = e => { e.preventDefault(); const v = document.getElementById('antwoord').value; if (v.trim()) beoordeel(v); };
  micKnop(beoordeel, g.goed);
}

// ---------- afronden ----------
let uitkomst = null;
function klaar() {
  stopGeluid(); boekMinuten();
  const d = lees(); d.items = d.items || {}; d.klaar = d.klaar || {};
  const [, dag] = (() => { d.dagen = d.dagen || {}; const k = vandaagStr(); d.dagen[k] = d.dagen[k] || { min: 0, blokken: {} }; return [d, d.dagen[k]]; })();
  // Herhaalschema: zonder fouten schuift een woord of zin naar een groter vak, met fouten één vak terug.
  const geoefend = new Map();
  S.taken.forEach(t => { const sit = sitVanTaak(t), x = t.w || t.z; if (x && sit) geoefend.set(itemSleutel(sit, x), true); });
  geoefend.forEach((_, k) => {
    const oud = d.items[k] ? d.items[k].vak : -1;
    const vak = S.fouten[k] ? Math.max(0, oud - 1) : Math.min(oud + 1, DAGEN.length - 1);
    d.items[k] = { vak, op: Date.now() + DAGEN[vak] * 864e5 };
  });
  if (S.les) d.klaar[`${S.les.sit.id}:${S.les.n}`] = true;
  if (S.blok === 'examen') (d.examens = d.examens || []).push({ op: Date.now(), delen: examenUitslag() });
  else dag.blokken[S.blok] = true;
  bewaar(d);
  const totaalFout = Object.values(S.fouten).reduce((a, b) => a + b, 0);
  const op = Object.values(d.items).map(x => x.op);
  uitkomst = { sterren: totaalFout <= 2 ? 3 : totaalFout <= 6 ? 2 : 1, volgende: op.length ? Math.min(...op) : null };
  toonKlaar();
}
function toonKlaar() {
  S.modus = 'klaar';
  if (!kaart || !document.body.contains(kaart)) sessieKader();
  tekenVoortgang();
  if (S.blok === 'examen') return toonExamen(examenUitslag());
  const n = uitkomst.sterren;
  const kanNu = S.les ? S.les.sit.niveaus[S.les.n].kanNu[TAAL] : { herhalen: t_().klaarHerhalen, luisteren: t_().klaarLuister, spreken: t_().klaarSpreken }[S.blok];
  const lastig = Object.keys(S.fouten).map(k => { const it = itemZoek(k); if (it) return { k, nl: it.x.nl };
    const [sid, id] = k.split(':'); const sit = sitVan(sid); const g = sit && sit.niveaus.flatMap(x => x.gesprek || []).find(x => x.id === id);
    return g ? { k, nl: g.jij || toonModel(g.goed[0]) } : null; }).filter(Boolean);
  el(`<div class="sterren" aria-label="${t_().sterren(n)}">${'★'.repeat(n)}${'☆'.repeat(3 - n)}</div>
    <p class="kan">${kanNu}</p>
    ${lastig.length ? `<p class="opdracht">${t_().extraOefenen}</p><ul class="lijst">${lastig.map(x => `<li>${nl(x.nl)}<span>${t_().keerFout(S.fouten[x.k])}</span></li>`).join('')}</ul>` : `<div class="tip">${t_().geenFouten}</div>`}
    ${uitkomst.volgende ? `<div class="tip">${t_().volgende} <b>${datum(uitkomst.volgende)}</b>. ${t_().kortBeter}</div>` : ''}
    <div class="duw"><button class="knop" id="terug">${t_().terug}</button></div>`);
  document.getElementById('terug').onclick = toonVandaag;
}

try { speechSynthesis.getVoices(); } catch {}
zetTaal();
toonVandaag();
</script>
